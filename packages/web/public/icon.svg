<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Macronome">
  <!-- PWA app icon (PWA-1, design/components/pwa.md). Brand "tick" — metronome ring + needle,
       amber baked (#e0b341) — on an opaque dark inner disc; transparent exterior. The maskable
       and apple-touch variants composite this on the dark disc (pwa-assets.config.ts). The
       browser-tab favicon.svg + the 00-foundations brand mark are unchanged. -->
  <circle cx="256" cy="256" r="167" fill="#0d0f12" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#e0b341" stroke-width="34" />
  <line x1="256" y1="256" x2="193" y2="89" stroke="#e0b341" stroke-width="34" stroke-linecap="round" />
  <circle cx="256" cy="256" r="17" fill="#e0b341" />
</svg>
