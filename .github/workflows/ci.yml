name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: macronome
          POSTGRES_PASSWORD: test
          POSTGRES_DB: macronome_test
        ports:
          - '5433:5432'
        options: >-
          --health-cmd "pg_isready -U macronome"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://macronome:test@localhost:5433/macronome_test

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Generate the Prisma client so type-aware lint/typecheck (and the runtime
      # tests) see real types instead of `any` (mirrors the Dockerfile build step).
      - run: npm run prisma:generate -w @macronome/api

      # Gates (no DB needed)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:schema
      - run: npm run check:i18n

      # Unit oracles (neutral *.test.ts only)
      - run: npm test

      # Integration against the service Postgres
      - run: npm run migrate
      - run: npm run test:int

      # e2e on pushes to main and on PRs (drives the running stack). B-246: the step used to be
      # PR-only, but this project pushes straight to main with no PRs, so it had never run once —
      # which is how four specs drifted out of date unnoticed while every other gate stayed green.
      - name: e2e
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: |
          printf 'DATABASE_URL=%s\nPORT=3000\nSESSION_SECRET=ci-session-secret-0123456789abcdef\nTRUSTED_PROXY=loopback\nPUBLIC_BASE_URL=http://localhost:5173\nCOOKIE_SECURE=false\nNODE_ENV=development\n' "$DATABASE_URL" > packages/api/.env
          npx playwright install --with-deps chromium
          npm run e2e
