name: Release image

# Build and publish the combined image to GHCR (ADR-0001): `:latest` on every push to
# main, and `:vX.Y.Z` / `:vX.Y` on version tags. Consumed by compose.yml in production.
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags, so `git describe` can resolve the version on main

      # Single source of truth = the git tag (ADR-0002). On a `vX.Y.Z` tag → that number; on a
      # main build → `git describe` (e.g. 0.9.0-5-g1a2b3c4, or the short sha before the first tag).
      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(git describe --tags --always | sed 's/^v//')"
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      # B-234: the docker/* majors below are the Node 24 ones (GitHub deprecated the Node 20 action
      # runtime). Pinned by major, like every other action here.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/macronome
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/api/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
