# Production stack (ADR-0001) — ZERO-CONFIG: pulls prebuilt images and runs with NO env
# vars to set. Deploy as-is in Portainer ("deploy stack") or any Docker host. The
# `macronome` image serves the SPA and /api/v1 on one port; front it with your own
# reverse proxy / TLS. Everything below has a default; override only if you want to.
# Data lives in Docker-managed named volumes (delete from Portainer > Volumes to reset).
# See docs/architecture/ops.md and decisions/0001-prebuilt-image-deployment.md.
services:
  macronome:
    image: ghcr.io/machintrucbidule/macronome:${MACRONOME_TAG:-latest}
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-macronome}:${POSTGRES_PASSWORD:-macronome}@postgres:5432/${POSTGRES_DB:-macronome}
      # SESSION_SECRET is auto-generated and persisted to the app volume on first boot
      # when unset (config/session-secret.ts). Set it only to manage it yourself.
      # Peers Express trusts for X-Forwarded-* (real client IP + HTTPS detection). The default
      # trusts loopback + private/container ranges, so a sidecar proxy / tunnel (cloudflared,
      # NPM, Traefik) is trusted out of the box — this is what lets COOKIE_SECURE=auto detect
      # HTTPS. Set to `loopback` to trust only same-host proxies, or a CIDR to tighten.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-loopback, uniquelocal}
      # auto (default) = cookies are marked Secure only when the request is seen as HTTPS, so
      # hardening turns itself on behind your HTTPS proxy and plain HTTP keeps working. Leave
      # it alone. `true` forces Secure and BREAKS EVERY LOGIN if TRUSTED_PROXY does not cover
      # your proxy (the cookie is then never emitted). `false` disables Secure entirely — the
      # lever to pull if logins ever fail in a way you suspect is cookie-related. See ops.md §4.
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      # Public HTTPS origin for the Google Drive OAuth callback when fronted by a reverse
      # proxy / tunnel (e.g. https://macronome.example.com). Optional; leave empty unless you
      # use the Drive backup behind a proxy (empty = unset). See ops.md §6c.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      NODE_ENV: production
    volumes:
      # Persists the auto-generated session secret (so logins survive restarts) and the
      # authentication black box (/data/auth_failures.jsonl — the record of failed logins
      # that survives recreating this container; see ops.md §6b).
      - 'appdata:/data'
    depends_on:
      postgres:
        condition: service_healthy
    # The image entrypoint runs `prisma migrate deploy` then starts the server.
    # Recommended: dump the DB before deploy (see ops.md §5).

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-macronome}
      POSTGRES_USER: ${POSTGRES_USER:-macronome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-macronome}
    volumes:
      # Named volume: the only critical state. Postgres is internal-only (no published
      # port), so the default credentials are fine.
      - 'pgdata:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-macronome}']
      interval: 10s
      retries: 5

volumes:
  pgdata:
  appdata:
