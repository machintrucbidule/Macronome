# Production stack (ADR-0001) — pulls prebuilt images; deploy as-is in Portainer or any
# Docker host. The `macronome` image serves the SPA and /api/v1 on one port; front it
# with your own reverse proxy / TLS (set TRUSTED_PROXY to that proxy). See ops.md.
services:
  macronome:
    image: ghcr.io/machintrucbidule/macronome:${MACRONOME_TAG:-latest}
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-loopback}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    # The image entrypoint runs `prisma migrate deploy` then starts the server.
    # Recommended: dump the DB before deploy (see ops.md §5).

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Bind-mount: the only critical state lives at a host path you choose (DATA_PATH).
      - '${DATA_PATH:-./data}/db:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      retries: 5
